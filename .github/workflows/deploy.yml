name: Publish Website to cPanel

on:
  push:
    branches:
      - staging

jobs:
  FTP-Deploy-Action:
    name: FTP-Deploy-Action
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      
      - name: Build assets (npm)
        run: |
          cd ./ecom  # ⚠️ Remove this line if your project is in the root
          npm install
          npm run build
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      
      - name: Install PHP dependencies
        run: |
          cd ./ecom  # ⚠️ Remove this line if your project is in the root
          composer install --no-dev --optimize-autoloader --no-progress --no-interaction
      
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.GOLD_LINE_FTP_SERVER }}
          username: ${{ secrets.GOLD_LINE_FTP_USERNAME }}
          password: ${{ secrets.GOLD_LINE_FTP_PASSWORD }}
          local-dir: ./ecom/  # ⚠️ Remove './ecom/' if your project is in the root
          server-dir: /home/segnwyff/ecom/  # ⚠️ Change to your cPanel directory
          dangerous-clean-slate: false  # Set to true to delete remote files not in local
          exclude: |
            .env
            .git/
            .github/
            node_modules/
            storage/logs/
            storage/framework/cache/
            tests/