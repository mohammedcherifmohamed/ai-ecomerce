name: Deploy Laravel App

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, bcmath, pdo_mysql, zip, gd
      
      - name: Install Composer dependencies
        working-directory: ./ecom
        run: composer install --optimize-autoloader --no-dev --no-progress --no-interaction --prefer-dist
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: './ecom/package-lock.json'
      
      - name: Install NPM dependencies & build assets
        working-directory: ./ecom
        run: |
          npm ci --no-audit --no-fund
          npm run build
      
      - name: Deploy with rsync
        run: |
          # Create SSH directory with proper permissions
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Add server to known_hosts (skip host key verification for now)
          ssh-keyscan -p 5804 ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          
          # Save private key with proper permissions
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Test SSH connection first
          echo "🔍 Testing SSH connection..."
          ssh -i ~/.ssh/deploy_key -p 5804 -o ConnectTimeout=10 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo '✅ SSH connection successful!'"
          
          # Sync files using rsync (exclude unnecessary files)
          echo "📦 Syncing files to server..."
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 5804 -o StrictHostKeyChecking=no" \
            --exclude '.env' \
            --exclude 'storage/logs/*' \
            --exclude 'storage/framework/cache/*' \
            --exclude 'bootstrap/cache/*' \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'tests' \
            ./ecom/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/segnwyff/ecom/
          
          echo "✅ File sync complete!"
      
      - name: Run remote Artisan commands
        run: |
          echo "🔄 Running post-deployment commands..."
          ssh -i ~/.ssh/deploy_key -p 5804 \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd /home/segnwyff/ecom
            
            # Set proper permissions
            echo "📁 Setting permissions..."
            chmod -R 775 storage bootstrap/cache
            chmod -R 775 public/uploads 2>/dev/null || true
            
            # Run migrations
            echo "🗄️  Running migrations..."
            php artisan migrate --force
            
            # Clear and rebuild cache
            echo "🧹 Clearing caches..."
            php artisan optimize:clear
            php artisan cache:clear
            php artisan config:clear
            php artisan view:clear
            php artisan route:clear
            
            # Optimize for production
            echo "⚡ Optimizing for production..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            
            # Restart queue workers
            echo "🔄 Restarting queue workers..."
            php artisan queue:restart 2>/dev/null || true
            
            # Set proper ownership if needed (adjust user:group)
            # chown -R www-data:www-data /home/segnwyff/ecom 2>/dev/null || true
            
            echo "✅ Deployment complete!"
          EOF
      
      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          curl -I -s -o /dev/null -w "HTTP Status: %{http_code}\n" \
            http://${{ secrets.VPS_HOST }} || echo "⚠️  Site not reachable (might be normal if using HTTPS)"
      
      - name: Deployment Success
        if: success()
        run: |
          echo "🎉 Deployment to staging was successful!"
          echo "📋 Environment: Staging"
          echo "🕐 Time: $(date)"
          echo "🔗 URL: http://${{ secrets.VPS_HOST }}"